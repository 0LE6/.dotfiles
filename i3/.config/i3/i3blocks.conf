# List of valid properties:
#
# align
# color
# command
# full_text
# instance
# interval
# label
# min_width
# name
# separator
# separator_block_width
# short_text
# signal
# urgent

# Global properties
#
# The top properties below are applied to every block, but can be overridden.
separator=false
markup=pango
# ------------ tests ----------
# [click]


# ------------ tests ----------

[separator]
full_text=|
color=#717171

[disk]
label= 
instance=/
command=~/.config/i3/scripts/disk
interval=30

[memory]
label= 
command=~/.config/i3/scripts/memory
interval=2

[cpu_usage]
label= 
command=~/.config/i3/scripts/cpu_usage
interval=2

[separator]
full_text=|
color=#717171

[CPU-temperature]
label=
command=~/.config/i3/scripts/temperature
interval=30

# Battery indicator
[battery]
command=~/.config/i3/scripts/battery
# change this to battery-pinebook-pro if you are running on pinebook-pro
label=
interval=30

[separator]
full_text=|
color=#717171

# sound
[volume]
command=~/.config/i3/scripts/volume
interval=2

[pavucontrol]
full_text=♪
command=pavucontrol

[separator]
full_text=|
color=#717171

#set power-profile
[ppd_menu]
full_text=
command=~/.config/i3/scripts/power-profiles
color=#407437

#Show the current power-profile
[ppd-status]
command=~/.config/i3/scripts/ppd-status
interval=5

[separator]
full_text=|
color=#717171

[time]
command=~/.config/i3/scripts/calendar
DATEFMT=+%a %d %b %H:%M:%S
# SHORTFMT=+%H:%M:%S
HEIGHT=180
WIDTH=220
interval=1

[separator]
full_text=|
color=#717171

[bluetooth]
command=~/.config/i3/scripts/bluetooth
interval=5

[network]
command=~/.config/i3/scripts/network
interval=5

[shutdown_menu]
full_text= 
command=~/.config/i3/scripts/powermenu
