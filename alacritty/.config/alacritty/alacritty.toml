# # family = "Monospace"
# family = "BlexMono Nerd Font"
# style = "Bold"
#
# [font.italic]
# # family = "Monospace"
# family = "BlexMono Nerd Font"
# style = "Italic"

[cursor]
blink_interval = 500

[cursor.style]
shape = "Beam"
blinking = "Always"
